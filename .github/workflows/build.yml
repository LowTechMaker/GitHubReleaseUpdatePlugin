name: Auto CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: windows-latest
    env:
      NuGetPackageSourceCredentials_SceneGalleryGitHub: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Verify plugin
        shell: pwsh
        run: ./eng/Verify-Plugin.ps1
